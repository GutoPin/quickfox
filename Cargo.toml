[package]
name = "quickfox"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Touch typing practice for the terminal: short sessions, five levels, fully offline"
license = "MIT"
repository = "https://github.com/GutoPin/quickfox"
homepage = "https://github.com/GutoPin/quickfox"
readme = "README.md"
keywords = ["typing", "tui", "terminal", "game", "practice"]
categories = ["command-line-utilities", "games"]
include = ["src/**", "assets/**", "config/**", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
anyhow = "1.0"
hound = "3.5"
lewton = "0.10"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
directories = "6.0"
fs2 = "0.4"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
