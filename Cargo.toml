[package]
name = "quickfox"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "An offline terminal typing game with guided progression and adaptive practice"
publish = false

[dependencies]
anyhow = "1.0"
hound = "3.5"
lewton = "0.10"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
directories = "6.0"
fs2 = "0.4"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
